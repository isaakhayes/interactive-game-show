*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090e;--panel:#0f131f;--line:rgba(255,255,255,.1);--text:#f8fafc;--muted:rgba(248,250,252,.6);--pink:#ff4fd8;--cyan:#4fd8ff;--k:.5;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--text);font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);display:flex;flex-direction:column}
button{font-family:inherit}a{color:inherit}
/* portfolio container: flush at the very top, same as the other projects */
.ipc{background:#0b1020;color:#cbd5e1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 18px;font-size:13px;line-height:1.3}
.ipc-brand{color:#fff;font-weight:700;text-decoration:none;font-size:14px;letter-spacing:.02em;display:flex;gap:8px;align-items:baseline}
.ipc-brand span{font-weight:400;color:#9ca3af;font-size:12px}
.ipc-right{display:flex;gap:18px;align-items:center}
.ipc-link{font:inherit;background:none;border:0;color:#cbd5e1;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.ipc-link:hover{color:#fff}
/* quiet stage: the phone is the page */
.stage{flex:1;display:flex;gap:56px;align-items:center;justify-content:center;padding:36px 20px 44px;max-width:960px;margin:0 auto;width:100%}
.phone{position:relative;border-radius:42px;background:#000;padding:10px;border:1px solid rgba(255,255,255,.18);box-shadow:0 25px 60px rgba(0,0,0,.7),0 0 30px rgba(255,79,216,.1);flex:none}
.vp{position:relative;border-radius:33px;overflow:hidden;background:#000;width:calc(676px*var(--k));height:calc(1171px*var(--k))}
.screen{position:absolute;left:0;top:0;width:676px;height:1171px;transform:scale(var(--k));transform-origin:0 0;overflow:hidden;font-family:Roboto,Arial,sans-serif;color:#111;transition:opacity .15s ease;background:#12082a}
.screen.out{opacity:0}
.panel{width:300px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin-bottom:18px}
.counter{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.name{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2;margin-bottom:8px}
.cap{font-size:14px;line-height:1.55;color:var(--muted);min-height:66px;margin-bottom:20px}
.nav-row{display:flex;gap:8px;margin-bottom:18px}
.btn{flex:1;padding:10px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .1s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.07);border-color:#fff}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#0b0510}.btn.primary:hover:not(:disabled){background:#ff6fe0;border-color:#ff6fe0}
.btn:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .1s}
.dot:hover{color:#fff;border-color:#fff}.dot.on{background:var(--pink);border-color:var(--pink);color:#0b0510}
.play{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.play:hover{color:#fff}
.btn:focus-visible,.dot:focus-visible,.play:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(max-width:820px){.stage{flex-direction:column;gap:22px;padding:22px 16px 36px}.panel{width:min(100%,420px)}.ipc{padding:9px 14px}.ipc-right{gap:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= the Confetti interface, drawn at the original 676 x 1171 pixel grid ================= */
.bgl{position:absolute;inset:0;background-size:cover;background-position:top center;background-repeat:no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.30),transparent 14%,transparent 60%,rgba(8,3,22,.5))}
.live{width:66px;height:37px;border-radius:6px;background:#e9343c;color:#fff;font:700 25px/37px Roboto,Arial,sans-serif;text-align:center;z-index:5}
.views{height:35px;padding:0 14px 0 10px;border-radius:7px;background:rgba(0,0,0,.42);color:#fff;font:700 24px/35px Roboto,Arial,sans-serif;display:flex;gap:9px;align-items:center;z-index:5}
.views svg{width:30px;height:30px}
.avs{height:54px;display:flex;align-items:center;z-index:5}
.av{width:54px;height:54px;border-radius:50%;border:3px solid #fff;color:#fff;font:700 22px/50px Roboto,Arial,sans-serif;text-align:center;margin-left:-16px;position:relative}
.av:first-child{margin-left:0}
.av .cash{position:absolute;right:-8px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:#34c75a;border:2px solid #fff;font:700 15px/20px Roboto;text-align:center;color:#fff}

@keyframes rip{0%{transform:scale(.3);opacity:.9}100%{transform:scale(5);opacity:0}}
.tile .heart.ho2 b{font-weight:500;font-size:30px;top:11px}
@media (prefers-reduced-motion:reduce){.sbpill,.sbpill *{animation:none!important}}
.sbo{position:absolute;inset:0;z-index:40;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}.sbo.in{transform:none}
.sbx{cursor:pointer}

.sheet{overflow-x:hidden;overflow-y:auto;scrollbar-width:none}.sheet::-webkit-scrollbar{display:none}
.frwrap{position:absolute;left:0;right:0;height:830px}
.sbv{cursor:pointer}
.pts{position:absolute;left:24px;right:24px;border-radius:18px;background:#f4f0fb;border:1.5px solid #ded2f4}
.ptsh{position:absolute;left:22px;top:14px;font:700 26px/34px Roboto,Arial,sans-serif;color:#3a2a63}
.ptsr{position:absolute;left:22px;right:22px;height:56px}
.ptsi{position:absolute;left:0;top:8px;width:40px;height:40px;border-radius:50%;background:#e4d9fa;color:#6a3fc0;display:flex;align-items:center;justify-content:center}.ptsi svg{width:24px;height:24px}
.ptsl{position:absolute;left:58px;top:10px;font:400 25px/36px Roboto,Arial,sans-serif;color:#333}
.ptsp{position:absolute;right:0;top:10px;font:700 25px/36px Roboto,Arial,sans-serif;color:#7c3fd0}

.chapters{display:flex;flex-direction:column;gap:8px;margin:16px 0 22px}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#e8e6f0;font:600 15px/1.2 Jost,Roboto,Arial,sans-serif;cursor:pointer;transition:all .12s}
.chap:hover{border-color:rgba(255,255,255,.4)}
.chap i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
.chap.on{background:var(--pink);border-color:var(--pink);color:#0b0510}.chap.on i{opacity:1}
.ctl{display:flex;gap:10px;align-items:center}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;transition:all .1s}
.ib:hover:not(:disabled){border-color:rgba(255,255,255,.6)}.ib:disabled{opacity:.3;cursor:default}
.play{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:0;height:46px;margin:0}
.play .pa{display:none}.play.on .pi{display:none}.play.on .pa{display:block}
.play{background:#fff;color:#0b0510;border:0;border-radius:99px;font:700 14px/1 Jost,Roboto,Arial,sans-serif;text-decoration:none;cursor:pointer;padding:0 18px;transition:all .12s}.play:hover{background:#ffe3f6}.play span{text-decoration:none}
.play{white-space:nowrap;padding:0 12px;font-size:13px;gap:6px}.play svg{width:16px;height:16px;flex:none}
.play,.play:hover,.play.on,.play.on:hover,.play:focus-visible{color:#0b0510;opacity:1;text-decoration:none}.play.on{background:#fff}.play:hover{background:#ffe3f6}.play span{white-space:nowrap}

SCREENS.right=()=>{const out=st.pick!==2,cnt=[93,289,32200];const rows=ROWS.map((tx,k)=>{const good=k===2,bad=out&&st.pick===k;const cls=good?'good':bad?'bad':'gray';const w=good?'100%':(k===0?'12px':'14px');return '<div class="ans r'+(k+1)+' '+cls+'"><div class="fill" data-w="'+w+'" style="width:0"></div><span>'+tx+'</span><span class="n" data-count="'+cnt[k]+'" style="right:20px'+(k===2?';line-height:63px':'')+'">0</span>'+(good?pic('C',3,'rv1')+pic('D',4,'rv2'):'')+'</div>'}).join('');return bg('right')+'<div class="shade"></div>'+topBar('32K',R_G)+(out?pill('pink',SAD,'Nope! Wrong answer'):pill('green',CHECK,'Yes! Right answer'))+'<div class="qcard"><div class="q">'+Q1+'</div>'+rows+'</div>'+nav};
SCREENS.howyoudid=()=>endBase('end','15K')+'<div class="modal"><h3>Here’s How You Did</h3>'+(st.out?'':burst)+'<div class="ring"><i>Y</i></div><div class="score">'+(st.out?0:10)+' out of 10 Correct</div><div class="share">SHARE</div></div><div class="sliver" style="left:650px"></div><div class="pager"><i class="on"></i><i></i><i></i></div>';
SCREENS.prize=()=>{const rows=(st.out?[['Pam',0],['Courtney',1],['John',2],['Jon',3]]:[['You',3],['Pam',0],['Courtney',1],['John',2]]);return endBase('end','15K')+'<div class="sliver" style="left:-34px"></div><div class="modal"><h3>Today’s Prize: $28,000.00</h3>'+rows.map((a,k)=>'<div class="prow" style="top:'+(116+k*92)+'px"><span class="pa" style="background:'+COLORS[a[1]]+'">'+a[0][0]+'</span><span class="pn">'+a[0]+'</span><span class="pw">Won $571.42</span></div>').join('')+'</div><div class="sliver" style="left:650px"></div><div class="pager"><i></i><i class="on"></i><i></i></div>'};
SCREENS.friends=()=>endBase('end','14K')+'<div class="sliver" style="left:-34px"></div><div class="modal"><h3>You and Your Friends</h3>'+[['You',st.out?0:10,3],['Priya',6,2],['Jordan',3,5]].map((a,k)=>'<div class="prow" style="top:'+(124+k*98)+'px"><span class="pa" style="background:'+COLORS[a[2]]+'">'+a[0][0]+'</span><span class="pn" style="top:0">'+a[0]+'</span><span class="sc">'+a[1]+'/10</span><div class="tr"><i style="width:'+a[1]*10+'%"></i></div></div>').join('')+'</div><div class="closebtn">CLOSE RESULTS</div>';
/* ---------- the status pill and the scoreboard ---------- */
const PILL_KEYS=['host-1','host-2','host-wide','q1','timesup','right','inrunning','partyfoul','final','tune'];
const HP='M35 60S4 40 4 20C4 10 11 3 20 3c6 0 12 3 15 9 3-6 9-9 15-9 9 0 16 7 16 17 0 20-31 40-31 40z';
const HG='<defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7fab"/><stop offset="1" stop-color="#e8336d"/></linearGradient></defs>';
const heartBtn=(n,cls)=>'<div class="sbpill'+cls+(n?' full':'')+'" data-n="'+n+'" role="button" tabindex="0" aria-label="Open the scoreboard"><svg viewBox="0 0 70 64" aria-hidden="true">'+HG+'<path class="ho" d="'+HP+'" fill="rgba(0,0,0,.3)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><g class="hf"><path d="'+HP+'" fill="url(#hg)"/><ellipse cx="22" cy="17" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-25 22 17)"/></g></svg><b class="pn">'+(n?n:'+')+'</b></div>';
const heartTile=n=>n?'<div class="heart"><svg viewBox="0 0 70 64" width="70" height="64">'+HG+'<path d="'+HP+'" fill="url(#hg)"/><ellipse cx="22" cy="17" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-25 22 17)"/></svg><b>'+n+'</b></div>':'<div class="heart ho2"><svg viewBox="0 0 70 64" width="70" height="64"><path d="'+HP+'" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg><b>+</b></div>';
const pillFor=key=>{const first=!st.pillSeen;st.pillSeen=true;const cue=!st.pillTapped&&key!=='q1'&&key!=='timesup';return heartBtn(0,(first?' enter':'')+(cue?' cue':''))};
PILL_KEYS.forEach(k=>{const f=SCREENS[k];SCREENS[k]=()=>f()+pillFor(k)});
let ovl=null,qleft=10;
function bubble(el){const pl=document.createElement('span');pl.className='plus';pl.textContent='+1';el.appendChild(pl);setTimeout(()=>pl.remove(),2600)}
function ripple(el){const r=document.createElement('span');r.className='rip';el.appendChild(r);setTimeout(()=>r.remove(),700)}
function fly(pill,heart){const fl=pill.cloneNode(true);fl.classList.remove('enter','cue','pulse','earn');fl.classList.add('fly');fl.style.cssText='position:absolute;left:313px;top:32px;width:50px;height:46px;z-index:60;margin:0;transform-origin:50% 50%;animation:none';fl.querySelectorAll('.plus,.rip').forEach(x=>x.remove());scr.appendChild(fl);const tx=554-338,ty=578-55,k=70/50;const an=fl.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+tx+'px,'+ty+'px) scale('+k+')'}],{duration:620*SP+1,delay:120*SP,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'});an.onfinish=()=>{fl.remove();heart.style.opacity=1;if(!st.sbOpened&&(parseInt(pill.dataset.n)||0)>=1){st.sbOpened=true;bubble(heart)}}}
function openSB(){if(ovl)return;clearInterval(tick);clearTimeout(auto);clearTimeout(playT);const o=document.createElement('div');o.className='sbo';o.innerHTML=SCREENS.scoreboard().replace(nav,'');const pill=scr.querySelector('.sbpill'),heart=o.querySelector('.tile3 .heart');scr.appendChild(o);ovl=o;requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('in')));if(pill&&heart&&!matchMedia('(prefers-reduced-motion: reduce)').matches){heart.style.opacity=0;fly(pill,heart)}}
function closeSB(){if(!ovl)return;const o=ovl;ovl=null;o.classList.remove('in');setTimeout(()=>o.remove(),380*Math.max(SP,.1));const k=path[i];if(k==='q1'&&qleft>0)startQ1(qleft);else if(k==='timesup')auto=setTimeout(()=>{if(path[i]==='timesup')render(path.indexOf('right'))},900*SP);schedule()}
/* ---------- chapters ---------- */
const CH=[['The invitation',['feed','countdown']],['The show opens',['open-s','open-logo','host-1','host-2','host-wide']],['The question',['q1','timesup','right','inrunning']],['The scoreboard',['scoreboard']],['The end',['partyfoul','final','howyoudid','prize','friends','tune']]];
const chOf=k=>CH.findIndex(c=>c[1].indexOf(k)>-1);
function rebuildDots(){}
function setPlay(on){const b=$('play');b.classList.toggle('on',on);b.querySelector('span').textContent=on?'Pause':'Play the show';b.setAttribute('aria-label',on?'Pause':'Play the show')}
function buildChapters(){const nv=$('chapters');nv.innerHTML='';CH.forEach((c,n)=>{const b=document.createElement('button');b.type='button';b.className='chap';b.innerHTML='<i></i>'+c[0];b.onclick=()=>goChapter(n);nv.appendChild(b)})}
function goChapter(n){stop();const first=CH[n][1].find(k=>path.indexOf(k)>-1);if(first)render(path.indexOf(first));else if(CH[n][0]==='The scoreboard'&&!ovl)openSB()}
/* ---------- the viewer ---------- */
let path=WIN,i=0,tick=null,auto=null,playing=false,playT=null;
const scr=$('screen'),have={};
function checkBgs(){document.querySelectorAll('.bgl[data-bg]').forEach(el=>{const k=el.dataset.bg;if(have[k]===undefined){have[k]=false;const im=new Image();im.onload=()=>{have[k]=true;document.querySelectorAll('.bgl[data-bg="'+k+'"]').forEach(e=>e.parentElement.classList.add('real'))};im.src='assets/bg-'+k+'.jpg'}else if(have[k])el.parentElement.classList.add('real')})}
function fit(){const native=/[?&]native/.test(location.search);const w=document.body.clientWidth;document.documentElement.style.setProperty('--k',native?1:(w>820?372/676:Math.min(340,w-64)/676))}
function reveal(){const items=[...scr.querySelectorAll('[data-count]')],t0=performance.now(),dur=1300*SP+1;requestAnimationFrame(()=>scr.querySelectorAll('.fill[data-w]').forEach(f=>{f.style.width=f.dataset.w}));(function stepf(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);items.forEach(el=>{el.textContent=fmt(+el.dataset.count*e)});if(p<1)requestAnimationFrame(stepf)})(t0)}
function awardPoint(){const p=scr.querySelector('.sbpill');if(!p||path[i]!=='tune')return;p.dataset.n='1';p.classList.remove('enter','cue');p.classList.add('full','earn','pulse');const n=p.querySelector('.pn');n.textContent='1';n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');bubble(p)}
function pop(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const host=document.createElement('div');host.className='popfx';host.style.cssText='position:absolute;left:338px;top:640px;z-index:30;pointer-events:none';const cols=['#ff4fa8','#35c0f0','#b45cf0','#ffd23f','#2dd4a0'];for(let n=0;n<46;n++){const p=document.createElement('i'),w=10+Math.random()*12;p.style.cssText='position:absolute;left:0;top:0;width:'+w+'px;height:'+w*.55+'px;background:'+cols[n%5]+';border-radius:2px';host.appendChild(p);const a=Math.PI+Math.random()*Math.PI,v=260+Math.random()*420,dx=Math.cos(a)*v,dy=Math.sin(a)*v*1.1,r=Math.random()*720-360;p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx*.6+'px,'+dy+'px) rotate('+r*.5+'deg)',opacity:1,offset:.45},{transform:'translate('+dx+'px,'+(dy+520)+'px) rotate('+r+'deg)',opacity:0}],{duration:(1400+Math.random()*700)*SP+1,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'})}scr.appendChild(host);setTimeout(()=>host.remove(),(2400*SP)+60)}
function startQ1(from){let left=from||10;qleft=left;const set=s=>{const n=$('qnum'),a=$('qarc');if(n)n.textContent=s;if(a)a.setAttribute('stroke-dashoffset',(150.8*(1-s/10)).toFixed(1))};set(left);clearInterval(tick);tick=setInterval(()=>{left--;qleft=left;set(Math.max(left,0));if(left<=0){clearInterval(tick);if(st.pick===null)st.pick=2;auto=setTimeout(()=>render(path.indexOf('timesup')),380*SP)}},1000*SP)}
function pick(k){if(path[i]!=='q1'||st.pick===k&&false)return;st.pick=k;scr.querySelectorAll('.ans[data-i]').forEach((el,n)=>{el.classList.remove('open','pick','lock');el.classList.add(n===k?'pick':'lock')})}
function render(n,instant){
  clearInterval(tick);clearTimeout(auto);ovl=null;
  let key=path[Math.max(0,Math.min(path.length-1,n))];
  const pos=k=>WIN.indexOf(k);if(['feed','countdown','open-s','open-logo'].indexOf(key)>-1)st.pillSeen=false;
  if(key==='q1'){st.pick=null;st.out=false;if(path!==WIN){path=WIN;rebuildDots()}}
  else if(st.pick===null&&pos(key)>pos('q1')){st.pick=2}
  if(key==='right'){const o=st.pick!==2;if(o!==st.out||path!==(o?OUT:WIN)){st.out=o;path=o?OUT:WIN;rebuildDots()}}
  i=path.indexOf(key);const N=path.length,m=META[key];
  const draw=()=>{scr.innerHTML=SCREENS[key==='scoreboard'?'inrunning':key]();scr.setAttribute('aria-label',m[0]+'. '+m[1]);scr.classList.remove('real');checkBgs();scr.classList.remove('out');
    if(key==='q1')startQ1();
    if(key==='timesup')auto=setTimeout(()=>{if(path[i]==='timesup')render(path.indexOf('right'))},1500*SP);
    if(key==='right'){reveal();if(!st.out)pop()}if(key==='tune')auto=setTimeout(awardPoint,1100*SP);if(key==='scoreboard')setTimeout(()=>{const p=scr.querySelector('.sbpill');if(p&&path[i]==='scoreboard'){ripple(p);setTimeout(()=>{if(path[i]==='scoreboard'&&!ovl){openSB();if(playing)setTimeout(()=>{if(playing&&ovl)closeSB()},3200*SP)}},550*SP)}},450*SP)
    schedule()};
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches)draw();else{scr.classList.add('out');setTimeout(draw,140*Math.max(SP,.2))}
  const cn=chOf(key);document.querySelectorAll('.chap').forEach((c,k)=>{c.classList.toggle('on',k===cn);c.setAttribute('aria-current',k===cn?'step':'false')});
  $('prev').disabled=i===0;$('next').disabled=i===N-1;
}
function stop(){playing=false;clearTimeout(playT);setPlay(false)}
function schedule(){if(!playing)return;clearTimeout(playT);const k=path[i];if(k==='q1'||k==='timesup')return;if(i>=path.length-1){stop();return}playT=setTimeout(()=>{if(playing)render(i+1)},(k==='right'?4300:3200)*SP)}
function play(){if(playing){stop();return}playing=true;setPlay(true);if(i===path.length-1)render(0);else schedule()}
buildChapters();
$('next').onclick=()=>{stop();render(i+1)};$('prev').onclick=()=>{stop();render(i-1)};$('play').onclick=play;
$('startOver').onclick=()=>{stop();st.pick=null;st.out=false;st.pillSeen=false;st.pillTapped=false;st.sbOpened=false;path=WIN;rebuildDots();render(0);window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();render(i+1)}else if(e.key==='ArrowLeft'){stop();render(i-1)}else if(e.key==='Escape'&&ovl){closeSB()}else if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ans')&&e.target.dataset.i){e.preventDefault();pick(+e.target.dataset.i)}else if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('sbpill')){e.preventDefault();st.pillTapped=true;e.target.classList.remove('cue');openSB()}});
scr.addEventListener('click',e=>{if(ovl&&e.target.closest&&e.target.closest('.sbv')){closeSB();return}if(e.target.closest&&e.target.closest('.sbx')){if(ovl)closeSB();else if(path[i]==='scoreboard'){stop();render(i-1)}return}const pl=e.target.closest&&e.target.closest('.sbpill');if(pl&&!ovl){st.pillTapped=true;pl.classList.remove('cue');openSB();return}const r=e.target.closest&&e.target.closest('.ans[data-i]');if(r&&path[i]==='q1')pick(+r.dataset.i)});
let tx=null;const ph=document.querySelector('.phone');
ph.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
ph.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40&&!e.target.closest('.ans')){stop();render(i+(dx<0?1:-1))}tx=null});
window.addEventListener('resize',fit);fit();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>render(0,true));
</script>
